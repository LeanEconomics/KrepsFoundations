name = "PreferenceProperties"
version = "0.1.0"
keywords = ["math", "economics", "microeconomics"]
defaultTargets = ["PreferenceProperties"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "PreferenceProperties"
